<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121216" />
  <meta name="description" content="THE HOLLY community fan page." />
  <title>THE HOLLY | Roblox Community</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: #121216;
      --line: #303138;
      --white: #f7f7f8;
      --muted: #aaaab5;
      --blue: #3153ae;
      --blue-hover: #4267cb;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: #050508 url("./background.jpg") center / cover no-repeat fixed;
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      isolation: isolate;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.69);
      z-index: -1;
    }
    .panel {
      width: min(100%, 470px);
      padding: clamp(27px, 5vw, 42px);
      background: rgba(18, 18, 22, 0.96);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 24px 85px rgba(0, 0, 0, 0.6);
      text-align: center;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .logo {
      display: block;
      width: 86%;
      max-width: 330px;
      height: auto;
      margin: 3px auto 31px;
    }
    h1 {
      font-size: clamp(30px, 6vw, 40px);
      letter-spacing: 0.6px;
      margin: 0 0 34px;
      font-weight: 750;
      line-height: 1.1;
    }
    .primary {
      appearance: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 10px;
      background: var(--blue);
      color: #fff;
      font: 700 16px/1.4 Arial, Helvetica, sans-serif;
      text-decoration: none;
      cursor: pointer;
      padding: 15px 18px;
      transition: background 140ms ease, transform 140ms ease;
    }
    .primary:hover { background: var(--blue-hover); transform: translateY(-1px); }
    .primary:focus-visible { outline: 3px solid #9db7ff; outline-offset: 3px; }
    .status-title { font-size: 23px; line-height: 1.3; margin: 0 0 15px; }
    .status-text { font-size: 16px; color: #d7d7dd; margin: 0 0 25px; line-height: 1.6; }
    .notice { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 26px 0 0; }
    .secondary { display: none; animation: appear 220ms ease both; }
    .secondary.visible { display: block; }
    .hidden { display: none; }
    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <img class="logo" src="./roblox-logo.png" alt="Roblox" />
    <h1>THE HOLLY</h1>

    <section id="first-step">
      <button class="primary" id="start-button" type="button">Get Your Free Items Early!</button>
    </section>

    <section class="secondary" id="second-step" aria-live="polite">
      <h2 class="status-title">Oops! One More Step</h2>
      <p class="status-text">Join the Official Group to Continue</p>
      <a class="primary" id="group-button" href="#" target="_blank" rel="noopener noreferrer">Join Official Group</a>
    </section>

    <p class="notice">Fan-made community page. Not affiliated with Roblox. Joining a group does not verify bot status or guarantee free items.</p>
  </main>

  <script>
    // =========================================================
    // KANKA, GRUP LİNKİNİ SADECE BURADAN DEĞİŞTİR! 👇
    // Gerçek bir Roblox topluluk bağlantısı kullan:
    const GROUP_URL = "https://www.roblox.com/communities/161344644/The-Holly";
    // =========================================================

    const firstStep = document.getElementById("first-step");
    const secondStep = document.getElementById("second-step");
    const groupButton = document.getElementById("group-button");

    // Sahte "roblox.com.ss" gibi bağlantılara yönlendirmeyi önler.
    function isOfficialRobloxGroup(link) {
      try {
        const url = new URL(link);
        return url.protocol === "https:" &&
          ["roblox.com", "www.roblox.com"].includes(url.hostname) &&
          /^\/(communities|groups)\/\d+\b/.test(url.pathname);
      } catch {
        return false;
      }
    }

    if (isOfficialRobloxGroup(GROUP_URL)) {
      groupButton.href = GROUP_URL;
    } else {
      groupButton.removeAttribute("href");
      groupButton.textContent = "Enter an Official Roblox Group URL";
      groupButton.setAttribute("aria-disabled", "true");
      groupButton.addEventListener("click", (event) => event.preventDefault());
    }

    document.getElementById("start-button").addEventListener("click", () => {
      firstStep.classList.add("hidden");
      secondStep.classList.add("visible");
    });
  </script>
</body>
</html>
