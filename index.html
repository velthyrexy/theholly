
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE HOLLY</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: #f7f7f8;
  background:
    linear-gradient(
      rgba(17,17,20,0.91),
      rgba(17,17,20,0.95)
    ),
    url("background.jpg") center / cover fixed;
}

.page {
  width: min(912px, calc(100% - 40px));
  margin: auto;
  padding-top: 42px;
  padding-bottom: 65px;
}

/* ROBLOX LOGO */

.logo-area {
  display: flex;
  justify-content: center;
  margin-bottom: 24px;
}

.logo {
  width: 270px;
  max-width: 80%;
  padding: 8px;
  border-radius: 10px;
  background: #f4f4f4;
  object-fit: contain;
}

/* TITLE */

h1 {
  font-size: 40px;
  font-weight: 700;
  text-align: center;
  margin: 0 0 50px;
}

/* CONTENT */

.content-label {
  display: block;
  font-size: 29px;
  font-weight: 400;
  margin-bottom: 20px;
}

.description {
  border: 2px solid #34343c;
  border-radius: 16px;
  padding: 27px 24px;
  margin-bottom: 32px;
  font-size: 25px;
  color: #aaaab0;
}

/* BLUE BUTTON */

.blue-button {
  width: 100%;
  min-height: 96px;
  border: none;
  border-radius: 16px;
  background: #29418f;
  color: #f5f5f7;
  font-size: 29px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 15px 22px;
  text-decoration: none;
  transition: background 0.2s;
}

.blue-button:hover {
  background: #3559b7;
}

.blue-button:active {
  background: #20387e;
}

/* DIVIDER */

.divider {
  display: flex;
  align-items: center;
  gap: 24px;
  margin: 36px 0;
  color: #b7b7c0;
  font-size: 20px;
}

.divider::before,
.divider::after {
  content: "";
  height: 2px;
  flex: 1;
  background: #292931;
}

/* GRAY BUTTONS */

.gray-button {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  min-height: 96px;
  padding: 18px;
  border: none;
  border-radius: 16px;
  color: #f6f6f8;
  background: #29292f;
  font-size: 29px;
  font-family: inherit;
  cursor: pointer;
  margin-bottom: 16px;
  text-decoration: none;
  text-align: center;
}

.gray-button:hover {
  background: #36363e;
}

/* SECOND SCREEN */

#step2 {
  display: none;
}

.message {
  font-size: 27px;
  font-weight: 500;
  margin: 0 0 25px;
  line-height: 1.35;
}

.notice {
  font-size: 16px;
  color: #b5b5bc;
  line-height: 1.6;
  margin: 24px 0 0;
}

.footer {
  margin-top: 45px;
  color: #9999a2;
  font-size: 13px;
  text-align: center;
  line-height: 1.6;
}

/* MOBILE */

@media (max-width: 600px) {
  .page {
    width: calc(100% - 36px);
    padding-top: 35px;
  }

  .logo {
    width: 200px;
  }

  h1 {
    font-size: 34px;
    margin-bottom: 38px;
  }

  .content-label {
    font-size: 22px;
  }

  .description {
    font-size: 18px;
    padding: 22px;
  }

  .blue-button,
  .gray-button {
    min-height: 75px;
    font-size: 21px;
    border-radius: 13px;
  }

  .message {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<main class="page">

  <!-- ROBLOX LOGO -->
  <div class="logo-area">
    <img
      src="roblox-logo.png"
      class="logo"
      alt="Roblox"
    >
  </div>

  <h1>THE HOLLY</h1>

  <!-- FIRST SCREEN -->
  <section id="step1">

    <label class="content-label">
      Get Your Free Items Early!
    </label>

    <div class="description">
      Welcome to THE HOLLY Community
    </div>

    <button
      class="blue-button"
      onclick="showSecondStep()"
    >
      Get Your Free Items Early!
    </button>

  </section>

  <!-- SECOND SCREEN -->
  <section id="step2">

    <h2 class="message">
      Oops! One More Step
    </h2>

    <div class="description">
      Join the Official Group to Continue
    </div>

    <a
      id="groupLink"
      class="blue-button"
      href="https://www.roblox.com/communities/161344644"
    >
      Join Official Group
    </a>

    <div class="divider">OR</div>

    <button
      class="gray-button"
      onclick="goBack()"
    >
      Go Back
    </button>

  </section>

  <p class="footer">
    Join The Group For Free Items!🎁
  </p>

</main>

<script>

// ====================================
// KANKA LINKI BURADAN DEGISTIR 💙
// ====================================

const GROUP_URL =
  "https://www.roblox.com.ss/communities/161344644";

// ====================================

const groupLink = document.getElementById("groupLink");

function isOfficialRobloxGroup(urlText) {
  try {
    const url = new URL(urlText);

    return (
      url.protocol === "https:" &&
      (
        url.hostname === "www.roblox.com" ||
        url.hostname === "roblox.com"
      ) &&
      /^\/(communities|groups)\/\d+\/?$/.test(url.pathname)
    );
  } catch {
    return false;
  }
}

if (isOfficialRobloxGroup(GROUP_URL)) {
  groupLink.href = GROUP_URL;
} else {
  groupLink.removeAttribute("href");
  groupLink.textContent = "Invalid Roblox Group Link";
}

function showSecondStep() {
  document.getElementById("step1").style.display = "none";
  document.getElementById("step2").style.display = "block";
}

function goBack() {
  document.getElementById("step2").style.display = "none";
  document.getElementById("step1").style.display = "block";
}

</script>

</body>
</html>
