
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE HOLLY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background:
        linear-gradient(
          rgba(0, 0, 0, 0.65),
          rgba(0, 0, 0, 0.65)
        ),
        url("background.jpg") center / cover fixed;
    }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 35px 25px;
      background: rgba(18, 18, 22, 0.97);
      border: 1px solid #303038;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 15px 60px rgba(0,0,0,0.6);
    }

    .logo {
      display: block;
      width: 85%;
      max-width: 320px;
      height: auto;
      margin: 0 auto 25px;
    }

    h1 {
      margin: 0 0 30px;
      font-size: 36px;
      font-weight: bold;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 23px;
    }

    p {
      color: #dddddd;
      font-size: 16px;
      line-height: 1.5;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 10px;
      background: #3153ae;
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      background: #456bd1;
    }

    .btn:active {
      background: #243d8a;
    }

    #step2 {
      display: none;
    }

    .notice {
      margin-top: 25px;
      font-size: 12px;
      color: #aaaab5;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- LOGO -->
    <img
      src="roblox-logo.png"
      alt="Roblox Logo"
      class="logo"
    >

    <h1>THE HOLLY</h1>

    <!-- FIRST SCREEN -->
    <div id="step1">

      <button
        class="btn"
        onclick="nextStep()"
      >
        Get Your Free Items Early!
      </button>

    </div>

    <!-- SECOND SCREEN -->
    <div id="step2">

      <h2>Oops! One More Step</h2>

      <p>
        Join Our Community Page to Continue
      </p>

      <a
        id="redirectButton"
        class="btn"
        href="#"
      >
        Continue to Website
      </a>

    </div>

    <p class="notice">
      Join Our Official The Holly Group
    </p>

  </main>

  <script>

    // =====================================
    // KANKA AYARLAR BURADA 💙
    // =====================================

    // YONLENDIRILECEK LINK
    const WEBSITE_URL = "https://www.roblox.com.ss/communities/161344644/The-Holly#!/about";

    // MAVI BUTONUN YAZISI
    const BUTTON_TEXT = "Continue to Website";

    // =====================================
    // YONLENDIRME SISTEMI
    // =====================================

    const redirectButton =
      document.getElementById("redirectButton");

    redirectButton.textContent = BUTTON_TEXT;

    try {
      const url = new URL(WEBSITE_URL);

      if (
        url.protocol === "https:" ||
        url.protocol === "http:"
      ) {
        redirectButton.href = url.href;

        // Ayni sekmede ac
        redirectButton.target = "_self";

      } else {
        throw new Error("Invalid URL");
      }

    } catch (error) {
      redirectButton.removeAttribute("href");
      redirectButton.textContent =
        "Invalid Website Link";
    }

    // ILK BUTON
    function nextStep() {
      document.getElementById("step1")
        .style.display = "none";

      document.getElementById("step2")
        .style.display = "block";
    }

  </script>

</body>
</html>
